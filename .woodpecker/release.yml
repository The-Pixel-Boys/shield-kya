# Port of .github/workflows/release.yml to Woodpecker CI.
# npm for @shield-agent/kya is normally published from the monorepo via tag
# kya-v* (The-Pixel-Boys/shield-agent). This public repo keeps the pipeline for
# optional publish when NPM_TOKEN is set. `npm_token` is intentionally NOT in
# this repo's Woodpecker secret store: Woodpecker does not inject a missing
# secret at all, so it is referenced as "${NPM_TOKEN:-}" and tag pushes
# without it must NOT fail — the publish guard skips in-shell (exit 0).
# Auth material goes to a temp .npmrc ($T/.npmrc via NPM_CONFIG_USERCONFIG),
# never ~/.npmrc — this is a public repo's release on a shared host.

when:
  event: tag
  ref: refs/tags/v*

steps:
  publish:
    image: bash
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - "T=\"$(mktemp -d)\"; trap 'rm -rf \"$T\"' EXIT"
      - pnpm install
      - pnpm test
      - pnpm build
      # Smoke help + offline
      - |
        node dist/cli.js --help
        set +e
        node dist/cli.js eval-tool --offline --tool-id org.sample.never.event --irreversible | tee /tmp/deny.txt
        deny=${PIPESTATUS[0]}
        node dist/cli.js eval-tool --offline --tool-id org.sample.data.write --irreversible | tee /tmp/ra.txt
        ra=${PIPESTATUS[0]}
        set -e
        test "$deny" -eq 1
        grep -q DENY /tmp/deny.txt
        test "$ra" -eq 4
        grep -q REQUIRE_APPROVE /tmp/ra.txt
      - pnpm pack --pack-destination "$T"
      # Publish to npm (or skip)
      - |
        set -euo pipefail
        if [ -z "${NPM_TOKEN:-}" ]; then
          echo "NPM_TOKEN is not set on The-Pixel-Boys/shield-kya."
          echo "Publish @shield-agent/kya from monorepo tag kya-v* on The-Pixel-Boys/shield-agent."
          echo "Skipping npm publish so this check stays green."
          exit 0
        fi
        printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$T/.npmrc"
        NPM_CONFIG_USERCONFIG="$T/.npmrc" pnpm publish --no-git-checks --access public
