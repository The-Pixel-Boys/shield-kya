# Port of .github/workflows/ci.yml to Woodpecker CI.
# Runs on the Hetzner agent (local backend, user `it`) — every step uses
# `image: bash`; Node 24 + pnpm 11 are on the agent PATH. Woodpecker clones
# automatically, so there is no checkout step.
# Push to main only. Pull request validation runs on GitHub-hosted runners
# (.github/workflows/ci.yml): fork PR code (package.json scripts, dependencies
# run by `pnpm install`) must never execute unsandboxed as `it` on the
# production host. Do not re-add a pull_request event here.

when:
  - event: push
    branch: [main]

steps:
  - name: test
    image: bash
    commands:
      - pnpm install
      - pnpm build
      - pnpm test
      # Offline DENY then REQUIRE_APPROVE
      - |
        set +e
        node dist/cli.js eval-tool --offline --tool-id org.sample.never.event --irreversible | tee /tmp/deny.txt
        deny=$PIPESTATUS
        node dist/cli.js eval-tool --offline --tool-id org.sample.data.write --irreversible | tee /tmp/ra.txt
        ra=$PIPESTATUS
        set -e
        test "$deny" -eq 1
        grep -q DENY /tmp/deny.txt
        test "$ra" -eq 4
        grep -q REQUIRE_APPROVE /tmp/ra.txt
        node dist/cli.js --help | tee /tmp/kya-help.txt
        grep -q dash /tmp/kya-help.txt
        node dist/cli.js dash --once --offline | tee /tmp/kya-dash.txt
        grep -q FREE /tmp/kya-dash.txt
      # MCP artifacts present
      - |
        test -f server.json
        node -e "const p=require('./package.json'); if(!p.mcpName) process.exit(1)"
