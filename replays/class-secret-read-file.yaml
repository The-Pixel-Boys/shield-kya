id: class-secret-read-file
kind: class
title: Read tool opens a private key
date: 2026-11-15
host: claude
tool: Read
input:
  file_path: >-
    ~/.ssh/id_ed25519
expect: deny
rule: secret-read-file
since: 0.32.8
vendor: ssh
fix: >-
  Add a deny rule such as Read(~/.ssh/**) to the Claude Code settings, and protect the key with a
  passphrase loaded through ssh-agent. A Read rule also covers shell commands such as cat, but not
  a script that opens the file itself, so enable the Claude Code sandbox when the block must hold.
credit: ""
