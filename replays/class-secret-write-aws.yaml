id: class-secret-write-aws
kind: class
title: Write an AWS access key id into a deploy script
date: 2026-11-15
host: claude
tool: Bash
input:
  command: "echo \"export AWS_ACCESS_KEY_ID=\u0041KIAIOSFODNN7EXAMPLE\" >> deploy/aws.sh"
expect: deny
rule: secret-write-aws
since: 0.33.0
vendor: aws
fix: >-
  Use IAM roles or IAM Identity Center (aws sso login), so scripts need no static access key. If a
  key reached a file, deactivate and rotate it in IAM.
credit: ""
