id: class-secret-read-environ
kind: class
title: Dump the environment of a running process
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat /proc/1/environ | tr '\0' '\n'
expect: deny
rule: secret-read-environ
since: 0.33.0
vendor: linux
fix: >-
  Run the agent as its own OS user: Linux lets only the same user, or root, read
  /proc/PID/environ. Keep secrets out of the environment of long-running processes, and read them
  from a file with mode 0600 or from a secret manager.
credit: ""
