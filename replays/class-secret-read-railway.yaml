id: class-secret-read-railway
kind: class
title: Read the Railway CLI token file
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat ~/.railway/config.json
expect: deny
rule: secret-read-railway
since: 0.33.0
vendor: railway
fix: >-
  Pass a project token in the environment of the one command that needs it, run railway logout on
  machines where an agent runs, and add a deny rule such as Read(~/.railway/**) to the Claude Code
  settings. A Read rule also covers shell commands such as cat, but not a script that opens the
  file itself, so enable the Claude Code sandbox when the block must hold.
credit: ""
