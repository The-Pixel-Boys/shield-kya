id: class-secret-write-stripe
kind: class
title: Write a Stripe live key into a shell profile
date: 2026-11-15
host: claude
tool: Bash
input:
  command: "echo \"export STRIPE_KEY=\u0073k_live_0123456789abcdefghijABCD\" >> scripts/env.sh"
expect: deny
rule: secret-write-stripe
since: 0.33.0
vendor: stripe
fix: >-
  Use a restricted API key (rk_live_) that has only the permissions the script needs, and keep it
  in a secret store and not in a shell file. If a live key reached a file, roll it in the Stripe
  Dashboard.
credit: ""
