id: class-git-force-push-main
kind: class
title: Force push to the main branch
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    git push --force origin main
expect: deny
rule: git-force-push-protected-branch
since: 0.32.8
vendor: git
fix: >-
  Protect main on the server (a GitHub branch protection rule or ruleset), leave force pushes off,
  and require a pull request. Administrators and bypass actors can skip these rules unless you
  enforce them for administrators, so the agent's token must not belong to either.
credit: ""
