id: class-gcloud-sql-delete-instance
kind: class
title: Google Cloud SQL instance deletion
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    gcloud sql instances delete prod-db
expect: deny
rule: cloud-delete
since: 0.33.0
vendor: gcloud
fix: >-
  Turn on deletion protection for the Cloud SQL instance (gcloud sql instances patch INSTANCE
  --deletion-protection), so a delete fails until a person turns it off. Give the agent an IAM
  role that has neither cloudsql.instances.delete nor cloudsql.instances.update (the Cloud SQL
  Editor role has update), because update can turn the protection off.
credit: ""
