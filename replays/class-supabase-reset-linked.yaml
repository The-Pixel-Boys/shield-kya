id: class-supabase-reset-linked
kind: class
title: Supabase db reset on the linked remote project
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    supabase db reset --linked
expect: deny
rule: supabase-reset-linked
since: 0.35.0
vendor: supabase
fix: >-
  Link the agent only to a staging project, never to production, and use the local stack (supabase
  start) for resets. Turn on backups for the production project (daily backups are automatic on
  paid plans, and point-in-time recovery is a paid add-on) and test a restore.
credit: ""
