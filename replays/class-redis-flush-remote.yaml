id: class-redis-flush-remote
kind: class
title: redis-cli FLUSHALL against a URL
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    redis-cli -u $REDIS_URL FLUSHALL
expect: deny
rule: redis-flush
since: 0.35.0
vendor: redis
fix: >-
  Give the agent a Redis ACL user (Redis 6 or later) with only +@read, or with +@all -@dangerous
  -flushall -flushdb, so it cannot run FLUSHALL or FLUSHDB: key patterns do not limit those
  commands. Keep the production REDIS_URL out of the agent environment.
credit: ""
