id: class-rm-unset-variable-root
kind: class
title: rm -rf of a path that starts with an unset variable
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    rm -rf "$UNSET_DIR/"
expect: deny
rule: rm-root-home
since: 0.33.0
vendor: filesystem
label: wipe the root folder
fix: >-
  In shell scripts, write ${VAR:?} before a deletion, as in rm -rf "${BUILD_DIR:?}/", so the
  script stops when the variable is empty or unset. Also start scripts with set -u.
credit: ""
