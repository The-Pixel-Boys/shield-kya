id: class-secret-read-docker
kind: class
title: Read the Docker registry credentials file
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat ~/.docker/config.json
expect: deny
rule: secret-read-docker
since: 0.33.0
vendor: docker
fix: >-
  Use a Docker credential helper (credsStore in ~/.docker/config.json, such as osxkeychain), so
  the file holds no password, and add a deny rule such as Read(~/.docker/**) to the Claude Code
  settings. A Read rule also covers shell commands such as cat, but not a script that opens the
  file itself, so enable the Claude Code sandbox when the block must hold.
credit: ""
