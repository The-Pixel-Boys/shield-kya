id: 2026-04-pocketos-railway-volume
kind: incident
title: Agent deletes a production volume and its backups through the Railway API
date: 2026-04-24
sources:
  - https://incidentdatabase.ai/cite/1469
reconstructed: true
host: claude
tool: Bash
input:
  command: >-
    curl -s -X POST https://backboard.railway.app/graphql/v2 -H "Authorization: Bearer $RAILWAY_TOKEN" -d '{"query":"mutation { volumeDelete(volumeId: \"vol_123\") }"}'
expect: deny
rule: railway-volume-delete
since: 0.33.0
vendor: railway
fix: >-
  Keep backups outside the Railway project, so one API call cannot delete a volume and its only
  backup. A project token (sent in the Project-Access-Token header) reaches one environment of one
  project, so it limits the damage of a misused token but does not stop a volume delete.
credit: ""
