id: class-git-hard-reset-clean
kind: class
title: git reset --hard followed by git clean -fdx
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    git reset --hard && git clean -fdx
expect: deny
rule: git-hard-reset-clean
since: 0.33.0
vendor: git
fix: >-
  Commit or stash before the agent starts, and push the branch to a remote. Git can bring back
  committed work, but not untracked or ignored files, so keep a copy of files such as .env that
  git does not track.
credit: ""
