id: class-gh-repo-delete
kind: class
title: GitHub repository deletion
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    gh repo delete org/repo --yes
expect: deny
rule: gh-repo-delete
since: 0.35.0
vendor: github
fix: >-
  Give the agent a fine-grained token limited to the repositories it needs, with no Administration
  permission, and do not add the delete_repo scope to a classic token. Keep a mirror clone of any
  repository you cannot lose.
credit: ""
