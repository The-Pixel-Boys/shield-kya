id: class-secret-write-github
kind: class
title: Write a GitHub token into a source file
date: 2026-11-15
host: claude
tool: Write
input:
  file_path: >-
    src/config.ts
  content: "export const token = \"\u0067hp_0123456789abcdefghijklmnopqrstuvwxyz\";\n"
expect: deny
rule: secret-write-github
since: 0.33.0
vendor: github
fix: >-
  Read the token from an environment variable or a secret store at run time, and revoke any token
  that reached a file. Turn on push protection for secret scanning in the repository settings: it
  blocks a push that holds a known token shape, unless the pusher gives a bypass reason.
credit: ""
