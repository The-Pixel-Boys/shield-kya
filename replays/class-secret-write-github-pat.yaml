id: class-secret-write-github-pat
kind: class
title: Write a fine-grained GitHub token into a CI file
date: 2026-11-15
host: claude
tool: Write
input:
  file_path: >-
    ci/publish.sh
  content: "export GH_TOKEN=\u0067ithub_pat_AAAAAAAAAAAAAAAAAAAAAA_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n"
expect: deny
rule: secret-write-github-pat
since: 0.33.0
vendor: github
fix: >-
  In GitHub Actions, use the built-in GITHUB_TOKEN with a permissions block, or an encrypted
  secret, and not a token in a file. If a token reached a file, revoke it in your GitHub settings.
credit: ""
