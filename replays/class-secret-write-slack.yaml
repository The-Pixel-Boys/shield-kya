id: class-secret-write-slack
kind: class
title: Write a Slack bot token into a config file
date: 2026-11-15
host: claude
tool: Write
input:
  file_path: >-
    config/slack.json
  content: "{\"token\": \"\u0078oxb-1234567890-abcdefghij\"}\n"
expect: deny
rule: secret-write-slack
since: 0.33.0
vendor: slack
fix: >-
  Read the Slack token from an environment variable or a secret store, and do not write it into a
  config file. If a token reached a file, rotate it in your Slack app settings.
credit: ""
