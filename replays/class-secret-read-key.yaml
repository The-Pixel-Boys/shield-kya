id: class-secret-read-key
kind: class
title: Read a private key kept outside ~/.ssh
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat deploy/keys/id_rsa
expect: deny
rule: secret-read-key
since: 0.33.0
vendor: ssh
fix: >-
  Keep private keys out of the project folder: store a deploy key in the secret store of your CI
  system, and add a deny rule such as Read(./deploy/keys/**) to the Claude Code settings. A Read
  rule also covers shell commands such as cat, but not a script that opens the file itself, so
  enable the Claude Code sandbox when the block must hold.
credit: ""
