id: class-secret-read-shell
kind: class
title: Read a production .env file with cat
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat .env.production
expect: deny
rule: secret-read-shell
since: 0.32.8
vendor: dotenv
fix: >-
  Keep production secrets in the secret store of your host and only development values in .env
  files, and add deny rules such as Read(./.env) and Read(./.env.*) to the Claude Code settings. A
  Read rule also covers shell commands such as cat, but not a script that opens the file itself,
  so enable the Claude Code sandbox when the block must hold.
credit: ""
