id: class-rm-project-wipe
kind: class
title: rm -rf of everything in the project folder
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    rm -rf ./*
expect: ask
rule: rm-project-wipe
since: 0.35.0
vendor: filesystem
fix: >-
  Commit often and push, so git can bring back the committed state of tracked files. rm -rf ./*
  skips names that start with a dot, so .git and .env survive, but untracked and ignored files
  without a leading dot, such as a local database, are lost, so keep a backup of those.
credit: ""
