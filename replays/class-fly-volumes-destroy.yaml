id: class-fly-volumes-destroy
kind: class
title: Fly.io volume destroy
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    fly volumes destroy --yes
expect: deny
rule: fly-destroy
since: 0.35.0
vendor: fly
fix: >-
  Keep copies of the volume data outside Fly, for example a scheduled dump to object storage. An
  app-scoped deploy token (fly tokens create deploy) limits the damage of a misused token to one
  app, but it does not stop a volume destroy.
credit: ""
