id: class-secret-read-pypirc
kind: class
title: Read the PyPI upload credentials file
date: 2026-11-15
host: claude
tool: Bash
input:
  command: >-
    cat ~/.pypirc
expect: deny
rule: secret-read-pypirc
since: 0.33.0
vendor: pypi
fix: >-
  Publish from CI with PyPI Trusted Publishing, so no upload token has to sit in ~/.pypirc. If you
  keep a token, use a project-scoped API token.
credit: ""
