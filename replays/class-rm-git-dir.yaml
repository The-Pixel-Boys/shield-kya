id: class-rm-git-dir
kind: class
title: rm -rf of the project .git folder
date: 2026-11-14
host: claude
tool: Bash
input:
  command: >-
    rm -rf .git
expect: deny
rule: rm-git-dir
since: 0.35.0
vendor: git
fix: >-
  Push the repository to a remote often, so the history also exists outside the project folder. A
  mirror clone (git clone --mirror) or a backup of the folder works too.
