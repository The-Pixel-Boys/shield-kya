# Generated by kya gate - regenerate with `kya gate run` (do not edit).
config:
  statsAddr: "off"
  readinessAddr: "off"
  adminAddr: "off"
  logging:
    level: "warn"
  tracing:
    otlpEndpoint: "http://127.0.0.1:3931"
    otlpProtocol: "http"
    randomSampling: true
frontendPolicies:
  networkAuthorization:
    rules:
      - allow: "cidr(\"127.0.0.0/8\").containsIP(source.address) || source.address == \"::1\""
binds:
  - port: 3930
    listeners:
      - routes:
          - backends:
              - mcp:
                  failureMode: "failOpen"
                  targets:
                    - name: "postgresql"
                      stdio:
                        cmd: "npx"
                        args:
                          - "-y"
                          - "@modelcontextprotocol/server-postgres"
                          - "postgresql://db"
                policies:
                  mcpAuthorization:
                    rules:
                      - "mcp.tool.target == 'postgresql' && !mcp.tool.name.matches('(?:^|_)(?:drop|truncate|purge|transfer)(?:_|$)|(?:drop|truncate|purge)')"
