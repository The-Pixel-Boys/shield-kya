# Generated by kya gate - regenerate with `kya gate run` (do not edit).
config:
  statsAddr: "off"
  readinessAddr: "off"
  adminAddr: "off"
  logging:
    level: "warn"
  tracing:
    otlpEndpoint: "http://127.0.0.1:3931"
    otlpProtocol: "http"
    randomSampling: true
frontendPolicies:
  networkAuthorization:
    rules:
      - allow: "cidr(\"127.0.0.0/8\").containsIP(source.address) || source.address == \"::1\""
binds:
  - port: 3930
    listeners:
      - routes:
          - backends:
              - mcp:
                  failureMode: "failOpen"
                  targets:
                    - name: "github"
                      stdio:
                        cmd: "npx"
                        args:
                          - "-y"
                          - "@modelcontextprotocol/server-github"
                        env:
                          "GITHUB_TOKEN": "<pat>"
                    - name: "exa"
                      mcp:
                        host: "https://mcp.exa.ai/mcp"
                    - name: "context7"
                      stdio:
                        cmd: "npx"
                        args:
                          - "-y"
                          - "@upstash/context7-mcp"
                policies:
                  mcpAuthorization:
                    rules:
                      - "mcp.tool.target == 'github' && !mcp.tool.name.matches('(?:^|_)(?:drop|truncate|purge|transfer)(?:_|$)|^(?:delete_|remove_|merge_|close_|dismiss_|revoke_|transfer_|archive_)')"
                      - "mcp.tool.target == 'exa' && !mcp.tool.name.matches('(?:^|_)(?:drop|truncate|purge|transfer)(?:_|$)')"
                      - "mcp.tool.target == 'context7' && !mcp.tool.name.matches('(?:^|_)(?:drop|truncate|purge|transfer)(?:_|$)')"
