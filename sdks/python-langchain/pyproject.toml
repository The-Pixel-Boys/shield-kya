[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kya-langchain"
version = "0.1.0"
description = "KYA policy callback for LangChain and LangGraph agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Shield Agent", email = "it@shield-agent.com"}
]
keywords = ["kya", "langchain", "langgraph", "agent-governance", "mcp", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "shield-kya>=0.13.0"
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]

[project.urls]
Homepage = "https://shield-agent.com/install"
Repository = "https://github.com/The-Pixel-Boys/shield-kya/tree/main/sdks/python-langchain"
Issues = "https://github.com/The-Pixel-Boys/shield-kya/issues"
