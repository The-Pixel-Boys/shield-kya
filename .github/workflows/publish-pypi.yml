name: publish-pypi

# Publishes the shield-kya Python shim (kya-python/) to PyPI via Trusted
# Publishing (OIDC) — no stored API token required.
#
# One-time PyPI-side setup (project: shield-kya):
#   PyPI → Manage project → Publishing → Add a new pending publisher:
#     Owner: The-Pixel-Boys   Repository: shield-kya
#     Workflow name: publish-pypi.yml   Environment name: pypi
# Also create the `pypi` environment in this repo's settings
# (Settings → Environments → New environment → "pypi").

on:
  workflow_dispatch:
  push:
    tags:
      - 'kya-v*'

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kya-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build dist
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Smoke import from the built wheel
        run: |
          python -m pip install --quiet dist/*.whl
          cd /tmp && python -c "import shield_kya; print(shield_kya.evaluate)"
      - uses: actions/upload-artifact@v4
        with:
          name: shield-kya-dist
          path: kya-python/dist/*
          if-no-files-found: error

  publish:
    name: upload to PyPI (trusted publishing)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/shield-kya
    permissions:
      id-token: write # OIDC token exchange for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shield-kya-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
