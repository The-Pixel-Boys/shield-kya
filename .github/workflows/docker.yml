name: docker

# Build and publish multi-arch KYA CLI/gateway images to GHCR and Docker Hub.
# Triggers on GitHub releases and manual workflow dispatch.
#
# Required secrets for GHCR (always):
#   GITHUB_TOKEN is provided automatically.
#
# Required secrets for Docker Hub (optional):
#   DOCKERHUB_USERNAME   Docker Hub organisation/username (default: shieldagent)
#   DOCKERHUB_TOKEN      Docker Hub access token
# If Docker Hub secrets are absent, the workflow still publishes to GHCR.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      kya_version:
        description: 'KYA npm version to install (e.g. 0.19.0)'
        required: false
        default: ''
        type: string
      tag_suffix:
        description: 'Optional image tag suffix (e.g. rc1)'
        required: false
        default: ''
        type: string

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_GHCR: ghcr.io/the-pixel-boys/shield-kya
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_DOCKERHUB: shieldagent/shield-kya

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        id: dockerhub_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Determine KYA version
        id: kya_version
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.kya_version }}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./package.json').version")
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Docker meta for GHCR
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_GHCR }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.inputs.tag_suffix }},enable=${{ github.event.inputs.tag_suffix != '' }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          build-args: |
            KYA_VERSION=${{ steps.kya_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta for Docker Hub
        id: meta_dockerhub
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_DOCKERHUB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.inputs.tag_suffix }},enable=${{ github.event.inputs.tag_suffix != '' }}

      - name: Build and push to Docker Hub
        if: steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          build-args: |
            KYA_VERSION=${{ steps.kya_version.outputs.value }}
          cache-from: type=gha

      - name: Summarize
        run: |
          echo "Published images:"
          echo "  ${{ env.IMAGE_GHCR }}:${{ steps.meta_ghcr.outputs.version }}"
          if [ "${{ steps.dockerhub_login.outcome }}" = "success" ]; then
            echo "  ${{ env.IMAGE_DOCKERHUB }}:${{ steps.meta_dockerhub.outputs.version }}"
          else
            echo "  Docker Hub push skipped (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set)."
          fi
