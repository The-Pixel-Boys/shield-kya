name: release-npm

# npm for @shield-agent/kya is published from the monorepo via tag kya-v*
# (The-Pixel-Boys/shield-agent). This public repo keeps the workflow for
# workflow_dispatch dry-runs and optional publish when NPM_TOKEN is set.
# Tag pushes without NPM_TOKEN must NOT fail main/tag status — skip publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test + pack only (no npm publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - name: Smoke help + offline
        run: |
          node dist/cli.js --help
          set +e
          node dist/cli.js eval-tool --offline --tool-id org.sample.never.event --irreversible | tee /tmp/deny.txt
          deny=${PIPESTATUS[0]}
          node dist/cli.js eval-tool --offline --tool-id org.sample.data.write --irreversible | tee /tmp/ra.txt
          ra=${PIPESTATUS[0]}
          set -e
          test "$deny" -eq 1
          grep -q DENY /tmp/deny.txt
          test "$ra" -eq 4
          grep -q REQUIRE_APPROVE /tmp/ra.txt
      - run: pnpm pack --pack-destination /tmp
      - name: Publish to npm
        if: ${{ (github.event_name == 'push' || inputs.dry_run == 'false') && secrets.NPM_TOKEN != '' }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skip npm (monorepo is source of truth)
        if: ${{ (github.event_name == 'push' || inputs.dry_run == 'false') && secrets.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN is not set on The-Pixel-Boys/shield-kya."
          echo "Publish @shield-agent/kya from monorepo tag kya-v* on The-Pixel-Boys/shield-agent."
          echo "Skipping npm publish so this tag/main check stays green."
