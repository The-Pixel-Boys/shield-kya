name: docs-pages

# Builds docs/ with Jekyll and deploys it to GitHub Pages (https://docs.shield-agent.com).
# The site files (config, layout, index, CNAME, robots.txt) live in .github/pages/,
# because the monorepo mirror sync keeps .github and replaces docs/.
# GitHub-owned actions only, each pinned by full commit SHA. No secrets.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/pages/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Assemble site source
        run: |
          mkdir site-src
          cp -R docs/. site-src/
          cp -R .github/pages/. site-src/
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site-src
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
