name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - name: Offline DENY then REQUIRE_APPROVE
        run: |
          set +e
          node dist/cli.js eval-tool --offline --tool-id org.sample.never.event --irreversible | tee /tmp/deny.txt
          deny=${PIPESTATUS[0]}
          node dist/cli.js eval-tool --offline --tool-id org.sample.data.write --irreversible | tee /tmp/ra.txt
          ra=${PIPESTATUS[0]}
          set -e
          test "$deny" -eq 1
          grep -q DENY /tmp/deny.txt
          test "$ra" -eq 4
          grep -q REQUIRE_APPROVE /tmp/ra.txt
          node dist/cli.js --help | tee /tmp/kya-help.txt
          grep -q dash /tmp/kya-help.txt
          node dist/cli.js dash --once --offline | tee /tmp/kya-dash.txt
          grep -q FREE /tmp/kya-dash.txt
      - name: MCP artifacts present
        run: |
          test -f server.json
          node -e "const p=require('./package.json'); if(!p.mcpName) process.exit(1)"
