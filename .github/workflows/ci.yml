name: ci

on:
  # PR validation runs here, on GitHub-hosted runners, never on the Woodpecker
  # agent (fork PR code must not run on the production host). Never use
  # pull_request_target in this file.
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
      - name: Offline DENY then REQUIRE_APPROVE
        run: |
          set +e
          node dist/cli.js eval-tool --offline --tool-id org.sample.never.event --irreversible | tee /tmp/deny.txt
          deny=${PIPESTATUS[0]}
          node dist/cli.js eval-tool --offline --tool-id org.sample.data.write --irreversible | tee /tmp/ra.txt
          ra=${PIPESTATUS[0]}
          set -e
          test "$deny" -eq 1
          grep -q DENY /tmp/deny.txt
          test "$ra" -eq 4
          grep -q REQUIRE_APPROVE /tmp/ra.txt
          node dist/cli.js --help | tee /tmp/kya-help.txt
          grep -q dash /tmp/kya-help.txt
          node dist/cli.js dash --once --offline | tee /tmp/kya-dash.txt
          grep -q FREE /tmp/kya-dash.txt
      - name: MCP artifacts present
        run: |
          test -f server.json
          node -e "const p=require('./package.json'); if(!p.mcpName) process.exit(1)"
