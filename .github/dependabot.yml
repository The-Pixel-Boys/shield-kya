# Dependabot policy: docs/operations/dependency-security-policy.md in The-Pixel-Boys/shield-agent (CVE first).
# Version updates run daily at 03:00 Europe/Bucharest. Security updates open when an alert is raised,
# outside this schedule. No auto-merge: the owner merges.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/vscode"
      - "/vscode/e2e/prod-harness"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/.oss-scanner"
      - "/packaging/docker"
      - "/packaging/ci/bitbucket-pipe"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/kya-python"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
