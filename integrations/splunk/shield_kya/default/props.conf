# Two sourcetypes. Both give the same normalized fields to the dashboard:
# kya_verdict, kya_reason_code, kya_tool, kya_mode, kya_host, kya_session_id, kya_mcp_server.

# Local trail file (~/.kya/trail.jsonl): one JSON object per line, written by the kya CLI.
# Send it with a Universal Forwarder file monitor, or to the HEC raw endpoint
# (/services/collector/raw), so that the line and time settings below apply.
[shield:kya:trail]
category = Application
description = Shield KYA local trail file, one JSON object per line
pulldown_type = 1
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "ts"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 20000
KV_MODE = json
FIELDALIAS-shield_kya_trail = verdict AS kya_verdict reasonCode AS kya_reason_code toolId AS kya_tool mode AS kya_mode sessionId AS kya_session_id
# The trail key "host" (ide or runtime) has the same name as the Splunk host field. A regex on _raw reads it as kya_host.
REPORT-shield_kya_trail_host = shield_kya_trail_host
REPORT-shield_kya_mcp_server = shield_kya_mcp_server

# Verdict spans from the OpenTelemetry Collector splunk_hec exporter (event endpoint).
# The span attributes are under "attributes". The resource attributes (service.name) are indexed fields.
[shield:kya:verdict]
category = Application
description = Shield KYA verdict spans from the OpenTelemetry Collector splunk_hec exporter
pulldown_type = 1
SHOULD_LINEMERGE = false
KV_MODE = json
EVAL-kya_verdict = 'attributes.kya.verdict'
EVAL-kya_reason_code = 'attributes.kya.reason_code'
EVAL-kya_tool = 'attributes.gen_ai.tool.name'
EVAL-kya_mode = 'attributes.kya.mode'
EVAL-kya_host = 'attributes.kya.host'
EVAL-kya_session_id = 'attributes.kya.session_id'
REPORT-shield_kya_mcp_server = shield_kya_mcp_server
