# Search-time extractions on _raw. props.conf references both stanzas.

# MCP server part of a gated tool id "<server>__<tool>" (for example postgres__drop_table gives postgres).
# Tool ids without "__" give no value.
[shield_kya_mcp_server]
REGEX = "(?:toolId|gen_ai\.tool\.name)"\s*:\s*"([^"_][^"]*?)__
FORMAT = kya_mcp_server::$1

# Gate host class (ide or runtime) from the trail key "host".
[shield_kya_trail_host]
REGEX = "host"\s*:\s*"([^"]+)"
FORMAT = kya_host::$1
