# Single-package workspace so `pnpm install` works in CI (working-directory: sdks/kya).
packages:
  - "."

# Allow esbuild native binary install (vitest/vite dependency). onnxruntime-node
# resolves to the script-free @shield-agent fork via fastembed; pnpm still keys
# the ignored-builds check on the installed name, so pin it to false.
allowBuilds:
  esbuild: true
  onnxruntime-node: false

minimumReleaseAgeExclude:
  - '@shield-agent/fastembed@3.0.0'
  - '@shield-agent/onnxruntime-node@1.21.0'

# GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 (vite)
# GHSA-67mh-4wv8-2f99 (esbuild)
overrides:
  vite: 6.4.3
  esbuild: 0.25.12
